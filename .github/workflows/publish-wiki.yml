name: Publish GitHub Wiki
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wiki remote
        id: wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if git ls-remote "$WIKI_URL" HEAD 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wiki not initialized. Open https://github.com/${{ github.repository }}/wiki → Create the first page → Save, then re-run this workflow."
          fi
      - name: Prepare gollum sidebar
        if: steps.wiki.outputs.ready == 'true'
        run: |
          if [ -f wiki/_Sidebar.gollum.md ]; then
            cp wiki/_Sidebar.gollum.md wiki/_Sidebar.md
          fi
      - name: Publish wiki pages
        if: steps.wiki.outputs.ready == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          strategy: init
