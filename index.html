<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>whaleshell docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #0A66C2; }
    .app-name-link img { max-height: 28px; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'whaleshell',
      repo: 'whaleshell/whaleshell-docs',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      homepage: 'wiki/Home.md',
      alias: {
        '/_sidebar.md': 'wiki/_Sidebar.md',
        '/.*/_sidebar.md': 'wiki/_Sidebar.md'
      },
      search: {
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
